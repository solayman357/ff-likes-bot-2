services:
  - type: web_service
    name: ff-likes-api2
    runtime: python
    plan: free
    rootDirectory: api
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: API_KEY
        sync: false
    healthCheckPath: /health

  - type: web_service
    name: ff-likes-bot2
    runtime: python
    plan: free
    rootDirectory: bot
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: ENCODED_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: solayman357/ff-likes-bot-2
      - key: GITHUB_DATA_BRANCH
        value: bot-data
      - key: API_URL
        fromService:
          name: ff-likes-api2
          type: web_service
          property: url
    healthCheckPath: /health